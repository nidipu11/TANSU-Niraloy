# ===================================================================
# TANSU NIRALOY - SPRING BOOT APPLICATION CONFIGURATION
# XAMPP MySQL Database Connectivity & Server Settings
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=tansu-niraloy-backend

# -------------------------------------------------------------------
# XAMPP MySQL Database Configuration
# -------------------------------------------------------------------
# Database URL: XAMPP runs MySQL on default port 3306
# Set createDatabaseIfNotExist=true so MySQL automatically creates the database!
spring.datasource.url=jdbc:mysql://localhost:3306/tansu_niraloy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
# ddl-auto=update: Automatically creates & updates tables based on Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date & Time formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Dhaka
