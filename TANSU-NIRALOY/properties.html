<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified Properties in Dhaka | TANSU Niraloy</title>
  <meta name="description" content="Explore verified rental apartments and flats for sale in Gulshan, Banani, Dhanmondi, Uttara, Mirpur, and Bashundhara.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="properties">

  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="flex justify-between items-center mb-4">
        <div>
          <span class="section-subtitle">Verified Catalog</span>
          <h1 id="catalog-title" style="font-size: 2.2rem; margin-bottom: 0.25rem;">Available Properties</h1>
          <p class="text-muted" id="properties-count">Loading verified listings...</p>
        </div>
        <button class="btn btn-sm btn-outline" id="btn-clear-filters">Reset Filters</button>
      </div>

      <!-- Quick Area Filter Chips (Gulshan, Banani, Dhanmondi, Uttara, Mirpur, Bashundhara, Mohammadpur) -->
      <div class="area-filter-chips mb-6" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; background: var(--color-surface); padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        <span style="font-size: 0.82rem; font-weight: 700; color: var(--color-primary); margin-right: 0.25rem;">Select Neighborhood:</span>
        <button type="button" class="area-chip active" data-chip-area="ALL">All Zones (35)</button>
        <button type="button" class="area-chip" data-chip-area="Gulshan">Gulshan (5)</button>
        <button type="button" class="area-chip" data-chip-area="Banani">Banani (5)</button>
        <button type="button" class="area-chip" data-chip-area="Dhanmondi">Dhanmondi (5)</button>
        <button type="button" class="area-chip" data-chip-area="Uttara">Uttara (5)</button>
        <button type="button" class="area-chip" data-chip-area="Mirpur">Mirpur (5)</button>
        <button type="button" class="area-chip" data-chip-area="Bashundhara">Bashundhara (5)</button>
        <button type="button" class="area-chip" data-chip-area="Mohammadpur">Mohammadpur (5)</button>
      </div>

      <!-- Multi-Criteria Filter Bar -->
      <div class="card mb-8" style="padding: 1.25rem; background-color: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="grid grid-cols-4 gap-4 mb-4">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-location" class="form-label" style="font-size: 0.8rem;">Location</label>
            <select id="filter-location" class="form-select">
              <option value="ALL">All Dhaka Areas</option>
              <option value="Gulshan">Gulshan</option>
              <option value="Banani">Banani</option>
              <option value="Dhanmondi">Dhanmondi</option>
              <option value="Uttara">Uttara</option>
              <option value="Mirpur">Mirpur</option>
              <option value="Bashundhara">Bashundhara</option>
              <option value="Mohammadpur">Mohammadpur</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-type" class="form-label" style="font-size: 0.8rem;">Property Type</label>
            <select id="filter-type" class="form-select">
              <option value="ALL">All Types</option>
              <option value="FAMILY_HOUSE">Family House</option>
              <option value="BACHELOR_HOUSE">Bachelor House</option>
              <option value="FLAT_SALE">Flat Sale</option>
              <option value="PREMIUM_FAMILY_HOUSING">Premium Housing</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-purpose" class="form-label" style="font-size: 0.8rem;">Purpose</label>
            <select id="filter-purpose" class="form-select">
              <option value="ALL">Rent & Sale</option>
              <option value="RENT">Rent</option>
              <option value="SALE">Sale</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-bedrooms" class="form-label" style="font-size: 0.8rem;">Bedrooms</label>
            <select id="filter-bedrooms" class="form-select">
              <option value="ALL">Any Bedrooms</option>
              <option value="1">1+ Bedrooms</option>
              <option value="2">2+ Bedrooms</option>
              <option value="3">3+ Bedrooms</option>
              <option value="4">4+ Bedrooms</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-between" style="border-top: 1px solid var(--color-border); padding-top: 1rem;">
          <div class="flex items-center gap-4 w-full" style="max-width: 450px;">
            <label for="filter-max-price" class="form-label" style="margin-bottom: 0; white-space: nowrap; font-size: 0.85rem;">Max Budget:</label>
            <input type="range" id="filter-max-price" min="15000" max="20000000" step="5000" value="20000000" style="width: 100%; accent-color: var(--color-accent);">
            <span id="price-display" style="font-weight: 700; font-size: 0.85rem; color: var(--color-primary); white-space: nowrap;">Any Price</span>
          </div>
          <div style="font-size: 0.78rem; color: var(--color-text-muted);">
            ⚡ Real-time client & Java REST API sync
          </div>
        </div>
      </div>

      <!-- Properties Grid -->
      <div id="properties-grid" class="grid grid-cols-3 gap-6">
        <!-- Rendered by js/properties.js -->
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      PropertiesController.initCatalog();
    });
  </script>
</body>
</html>
