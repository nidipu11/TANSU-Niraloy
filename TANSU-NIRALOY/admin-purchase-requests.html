<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Requests Management | TANSU Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="admin-purchases">

  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="flex justify-between items-center mb-6">
        <div>
          <span class="section-subtitle">Property Sales Intermediary</span>
          <h1 style="font-size: 2.2rem; margin-bottom: 0.25rem;">Purchase Requests Queue</h1>
          <p class="text-muted">Manage formal buyer inquiries, deed vetting, and deed registration escrow procedures.</p>
        </div>
        <a href="admin-dashboard.html" class="btn btn-outline">&larr; Back to Dashboard</a>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Request ID</th>
                <th>Buyer Tenant ID</th>
                <th>Property ID</th>
                <th>Type</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-requests-table-body">
              <!-- Rendered by js/admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AdminController.loadRequestsQueue("BUY");
    });
  </script>
</body>
</html>
