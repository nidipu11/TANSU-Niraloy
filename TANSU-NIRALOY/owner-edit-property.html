<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Property Listing | TANSU Niraloy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="owner-edit-property">

  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 860px;">
      <div class="flex justify-between items-center mb-6">
        <div>
          <span class="section-subtitle">Property Modification</span>
          <h1 style="font-size: 2.2rem; margin-bottom: 0.25rem;">Edit Property: <span id="display-prop-id">PROP-...</span></h1>
          <p class="text-muted">Changes to price or floor area may require re-verification by TANSU Admin.</p>
        </div>
        <a href="owner-dashboard.html" class="btn btn-outline">&larr; Back to Dashboard</a>
      </div>

      <div class="card" style="padding: 2.5rem;">
        <form id="property-edit-form" novalidate>
          <div class="form-group">
            <label for="property-title" class="form-label">Property Title <span class="required">*</span></label>
            <input id="property-title" name="title" type="text" class="form-control" required>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div class="form-group">
              <label for="property-location" class="form-label">Location</label>
              <select id="property-location" name="location" class="form-select" required>
                <option value="Gulshan">Gulshan</option>
                <option value="Banani">Banani</option>
                <option value="Dhanmondi">Dhanmondi</option>
                <option value="Uttara">Uttara</option>
                <option value="Mirpur">Mirpur</option>
                <option value="Bashundhara">Bashundhara</option>
                <option value="Mohammadpur">Mohammadpur</option>
              </select>
            </div>

            <div class="form-group">
              <label for="property-type" class="form-label">Property Type</label>
              <select id="property-type" name="propertyType" class="form-select" required>
                <option value="FAMILY_HOUSE">Family House</option>
                <option value="BACHELOR_HOUSE">Bachelor House</option>
                <option value="FLAT_SALE">Flat Sale</option>
                <option value="PREMIUM_FAMILY_HOUSING">Premium Family Housing</option>
              </select>
            </div>

            <div class="form-group">
              <label for="property-purpose" class="form-label">Purpose</label>
              <select id="property-purpose" name="purpose" class="form-select" required>
                <option value="RENT">For Rent</option>
                <option value="SALE">For Sale</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-4">
            <div class="form-group">
              <label for="property-price" class="form-label">Price (BDT) <span class="required">*</span></label>
              <input id="property-price" name="price" type="number" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="property-area" class="form-label">Area (sqft) <span class="required">*</span></label>
              <input id="property-area" name="area" type="number" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="property-bedrooms" class="form-label">Bedrooms</label>
              <input id="property-bedrooms" name="bedrooms" type="number" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="property-bathrooms" class="form-label">Bathrooms</label>
              <input id="property-bathrooms" name="bathrooms" type="number" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label for="property-description" class="form-label">Description <span class="required">*</span></label>
            <textarea id="property-description" name="description" class="form-control" rows="4" required></textarea>
          </div>

          <div class="flex justify-between items-center mt-6 pt-4" style="border-top: 1px solid var(--color-border);">
            <a href="owner-dashboard.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary btn-lg">Update Listing</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!Auth.requireAuth(["OWNER"])) return;
      const urlParams = new URLSearchParams(window.location.search);
      const propId = urlParams.get("id") || "PROP-101";

      document.getElementById("display-prop-id").textContent = propId;
      const res = await apiGet(`/api/properties/${propId}`);
      if (res.success && res.data) {
        const p = res.data;
        document.getElementById("property-title").value = p.title;
        document.getElementById("property-location").value = p.location;
        document.getElementById("property-type").value = p.propertyType;
        document.getElementById("property-purpose").value = p.purpose;
        document.getElementById("property-price").value = p.price;
        document.getElementById("property-area").value = p.area;
        document.getElementById("property-bedrooms").value = p.bedrooms;
        document.getElementById("property-bathrooms").value = p.bathrooms;
        document.getElementById("property-description").value = p.description;
      }

      const form = document.getElementById("property-edit-form");
      form.onsubmit = async (e) => {
        e.preventDefault();
        const updated = {
          title: document.getElementById("property-title").value.trim(),
          location: document.getElementById("property-location").value,
          propertyType: document.getElementById("property-type").value,
          purpose: document.getElementById("property-purpose").value,
          price: Number(document.getElementById("property-price").value),
          area: Number(document.getElementById("property-area").value),
          bedrooms: Number(document.getElementById("property-bedrooms").value),
          bathrooms: Number(document.getElementById("property-bathrooms").value),
          description: document.getElementById("property-description").value.trim()
        };
        await apiPut(`/api/properties/${propId}`, updated);
        Components.showToast("success", "Listing Updated", `Property ${propId} details have been updated.`);
        setTimeout(() => window.location.href = "owner-dashboard.html", 1200);
      };
    });
  </script>
</body>
</html>
