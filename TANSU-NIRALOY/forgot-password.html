<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TANSU Niraloy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="forgot-password">

  <div id="site-header-container"></div>

  <main class="main-content flex items-center justify-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 480px;">
      <div class="card" style="padding: 2.25rem;">
        <div class="text-center mb-6">
          <div class="brand-symbol" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem;">TN</div>
          <h2 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Reset Account Password</h2>
          <p class="text-muted" style="font-size: 0.88rem; margin-bottom: 0;">Enter your registered Gmail to initiate password recovery</p>
        </div>

        <form id="forgot-password-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Registered Gmail Address <span class="required">*</span></label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              placeholder="yourname@gmail.com"
              required
              autocomplete="email"
            >
            <div class="form-hint">A verification token payload will be formatted for the Java Auth service.</div>
          </div>

          <button type="submit" id="btn-forgot-submit" class="btn btn-primary btn-block btn-lg mb-4">
            Request Password Reset
          </button>

          <div class="text-center" style="font-size: 0.88rem; color: var(--color-text-muted);">
            Remembered your credentials?
            <a href="signin.html" style="font-weight: 600; color: var(--color-accent-dark);">Back to Sign In</a>
          </div>
        </form>

        <!-- Dynamic UI State Container -->
        <div id="forgot-status-container" style="display: none; margin-top: 1.5rem; padding: 1rem; border-radius: var(--radius-md); background-color: var(--color-surface-alt); border: 1px solid var(--color-border); font-size: 0.85rem;">
          <div id="status-title" style="font-weight: 700; color: var(--color-primary); margin-bottom: 0.25rem;"></div>
          <p id="status-desc" class="text-muted" style="margin-bottom: 0.5rem;"></p>
          <div id="api-payload-box" style="font-family: monospace; font-size: 0.78rem; background: #FFFFFF; color: var(--color-primary); padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); word-break: break-all;"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("forgot-password-form");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("btn-forgot-submit");
      const statusBox = document.getElementById("forgot-status-container");
      const statusTitle = document.getElementById("status-title");
      const statusDesc = document.getElementById("status-desc");
      const payloadBox = document.getElementById("api-payload-box");

      form.onsubmit = async (e) => {
        e.preventDefault();
        Validation.clearAllErrors(form);

        const email = emailInput.value.trim();
        const check = Validation.validateGmail(email);
        if (!check.valid) {
          Validation.showError(emailInput, check.message);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Connecting to Service...";

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "Request Password Reset";
          statusBox.style.display = "block";
          statusTitle.textContent = "✓ Reset Request Formatted (Backend Ready)";
          statusDesc.textContent = "The reset request has been validated. In the upcoming Java backend integration, this invokes POST /api/auth/forgot-password with secure SMTP token dispatch.";
          payloadBox.textContent = JSON.stringify({
            action: "PASSWORD_RESET_REQUEST",
            email: email,
            timestamp: new Date().toISOString(),
            expectedJavaEndpoint: "POST /api/auth/forgot-password"
          }, null, 2);
          Components.showToast("info", "Validation Successful", "Password reset request formatted for Java backend.");
        }, 800);
      };
    });
  </script>
</body>
</html>
