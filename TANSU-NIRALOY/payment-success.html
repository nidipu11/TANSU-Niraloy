<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | TANSU Niraloy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="payment-success">

  <div id="site-header-container"></div>

  <main class="main-content flex items-center justify-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 580px;">
      <div class="card" style="padding: 2.5rem; text-align: center;">
        <div style="width: 72px; height: 72px; background: #DCFCE7; color: #16A34A; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.25rem auto;">
          ✓
        </div>

        <h2 style="font-size: 1.8rem; margin-bottom: 0.35rem; color: var(--color-primary);">Payment Successful</h2>
        <p class="text-muted" style="font-size: 0.95rem; margin-bottom: 2rem;">
          Your transaction has been cleared through TANSU Niraloy Intermediary Gateway.
        </p>

        <!-- Receipt Summary Box -->
        <div style="background: var(--color-surface-alt); border-radius: var(--radius-md); padding: 1.5rem; text-align: left; margin-bottom: 2rem; border: 1px solid var(--color-border); font-size: 0.9rem;">
          <div class="flex justify-between py-1 mb-2" style="border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
            <span class="text-muted">Transaction ID:</span>
            <code id="success-txn-id" style="font-weight: 700;">TXN-88219</code>
          </div>
          <div class="flex justify-between py-1 mb-2" style="border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
            <span class="text-muted">Property ID:</span>
            <strong id="success-prop-id">PROP-102</strong>
          </div>
          <div class="flex justify-between py-1 mb-2" style="border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
            <span class="text-muted">Payment Type:</span>
            <span id="success-pay-type">Monthly Rent</span>
          </div>
          <div class="flex justify-between py-1 mb-2" style="border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
            <span class="text-muted">Payment Method:</span>
            <span id="success-pay-method">CARD</span>
          </div>
          <div class="flex justify-between py-1 mb-2" style="border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
            <span class="text-muted">Date &amp; Time:</span>
            <span id="success-pay-date">...</span>
          </div>
          <div class="flex justify-between py-1" style="font-size: 1.15rem; font-weight: 800; color: var(--color-primary); padding-top: 0.5rem;">
            <span>Amount Paid:</span>
            <span id="success-amount">৳ 0</span>
          </div>
        </div>

        <div class="flex gap-3 justify-center">
          <button class="btn btn-outline" onclick="window.print()">
            📄 Download Receipt
          </button>
          <a href="tenant-dashboard.html" class="btn btn-primary">
            Back to Tenant Dashboard &rarr;
          </a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      document.getElementById("success-txn-id").textContent = urlParams.get("txnId") || "TXN-88219";
      document.getElementById("success-prop-id").textContent = urlParams.get("propId") || "PROP-102";
      const method = decodeURIComponent(urlParams.get("method") || "ONLINE_GATEWAY");
      const methodEl = document.getElementById("success-pay-method");
      if (method.includes("bKash")) {
        methodEl.innerHTML = `<img src="assets/logos/bkash.png" alt="bKash" style="height: 18px; vertical-align: middle; margin-right: 6px;"> <strong>${method}</strong>`;
      } else if (method.includes("Nagad")) {
        methodEl.innerHTML = `<img src="assets/logos/nagad.png" alt="Nagad" style="height: 18px; vertical-align: middle; margin-right: 6px;"> <strong>${method}</strong>`;
      } else if (method.includes("Rocket")) {
        methodEl.innerHTML = `<img src="assets/logos/rocket.png" alt="Rocket" style="height: 18px; vertical-align: middle; margin-right: 6px;"> <strong>${method}</strong>`;
      } else {
        methodEl.textContent = method;
      }
      document.getElementById("success-pay-date").textContent = new Date().toLocaleString();

      const amt = Number(urlParams.get("amount") || 45150);
      document.getElementById("success-amount").textContent = `৳ ${amt.toLocaleString()}`;

      const dueId = urlParams.get("dueId");
      if (dueId) {
        try {
          let dues = JSON.parse(localStorage.getItem("tansu_dues") || "[]");
          let updated = false;
          dues = dues.map(d => {
            if (d.dueId === dueId && d.status !== "PAID") {
              updated = true;
              return { ...d, paidAmount: d.totalBilled, dueAmount: 0.0, status: "PAID", paymentDate: new Date().toISOString().split("T")[0] };
            }
            return d;
          });
          if (updated) localStorage.setItem("tansu_dues", JSON.stringify(dues));
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
