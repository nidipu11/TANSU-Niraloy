<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed | TANSU Niraloy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="payment-failed">

  <div id="site-header-container"></div>

  <main class="main-content flex items-center justify-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 540px;">
      <div class="card" style="padding: 2.5rem; text-align: center;">
        <div style="width: 72px; height: 72px; background: #FEE2E2; color: #DC2626; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.25rem auto;">
          ✕
        </div>

        <h2 style="font-size: 1.8rem; margin-bottom: 0.35rem; color: var(--color-primary);">Payment Incomplete</h2>
        <p class="text-muted" style="font-size: 0.95rem; margin-bottom: 2rem;">
          The issuing bank or MFS gateway was unable to authorize the transaction. No funds were debited from your account.
        </p>

        <div style="background: var(--color-surface-alt); border-radius: var(--radius-md); padding: 1.25rem; text-align: left; margin-bottom: 2rem; border: 1px solid var(--color-border); font-size: 0.88rem;">
          <div class="flex justify-between py-1 mb-2">
            <span class="text-muted">Transaction ID:</span>
            <code id="failed-txn-id">TXN-FAILED</code>
          </div>
          <div class="flex justify-between py-1 mb-2">
            <span class="text-muted">Gateway Failure Code:</span>
            <span style="color: var(--color-danger); font-weight: 600;" id="failed-reason">INSUFFICIENT_FUNDS_OR_TIMEOUT</span>
          </div>
          <div class="flex justify-between py-1">
            <span class="text-muted">Timestamp:</span>
            <span id="failed-date">...</span>
          </div>
        </div>

        <div class="flex gap-3 justify-center">
          <a href="payment.html" class="btn btn-primary">
            🔄 Retry Payment
          </a>
          <a href="tenant-dashboard.html" class="btn btn-outline">
            Back to Dashboard
          </a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      document.getElementById("failed-txn-id").textContent = urlParams.get("txnId") || `TXN-${Math.floor(100000 + Math.random() * 900000)}`;
      document.getElementById("failed-reason").textContent = urlParams.get("reason") || "AUTHORIZATION_DECLINED_BY_ISSUER";
      document.getElementById("failed-date").textContent = new Date().toLocaleString();
    });
  </script>
</body>
</html>
